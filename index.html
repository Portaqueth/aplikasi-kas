<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kas Digital - Multi Kas & Cloud Sync</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            
            .summary-card { 
                border: 1px solid #94a3b8 !important; 
                background-color: #ffffff !important; 
                box-shadow: none !important;
                color: #1e293b !important;
            }
            .summary-card p { color: #334155 !important; }
            .summary-card .icon-box { 
                border: 1px solid #cbd5e1 !important; 
                background-color: #f8fafc !important; 
            }
            
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #94a3b8 !important; padding: 6px 10px !important; font-size: 11pt !important; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-12 transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 no-print"></div>

    <!-- Header Dokumen Cetak PDF -->
    <div class="hidden print-only p-6 mb-4 border-b-2 border-slate-800 dark:border-slate-200">
        <div class="flex justify-between items-center">
            <div>
                <h1 id="printAppName" class="text-2xl font-bold text-slate-900">Aplikasi Kas</h1>
                <p id="printSubTitle" class="text-sm text-slate-600">Laporan Kas Terintegrasi</p>
            </div>
            <div class="text-right text-xs text-slate-500">
                <p>Dicetak pada: <span id="printDate"></span></p>
                <p>Status: Laporan Cloud Google Sheets</p>
            </div>
        </div>
    </div>

    <!-- PANEL SETUP URL APPS SCRIPT -->
    <div id="configSection" class="max-w-md mx-auto pt-16 px-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-md border border-slate-200 dark:border-slate-700">
            <div class="flex items-center space-x-3 mb-4">
                <div class="bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 p-3 rounded-xl">
                    <i class="fa-solid fa-link text-xl"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Hubungkan ke Google Sheets</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Masukkan URL Web App berakhiran /exec</p>
                </div>
            </div>

            <div class="space-y-3">
                <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-slate-800 dark:text-slate-100">
                <button type="button" onclick="saveScriptUrl()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl transition shadow-sm">
                    Simpan & Hubungkan Database
                </button>
            </div>
        </div>
    </div>

    <!-- PANEL AUTHENTICATION -->
    <div id="authSection" class="max-w-md mx-auto pt-12 px-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-md border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-6">
                <div class="inline-block bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 p-4 rounded-2xl mb-2">
                    <i class="fa-solid fa-wallet text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Aplikasi Kas Digital</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Sistem Pembukuan Kas Terintegrasi Google Sheets</p>
            </div>

            <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl mb-6 text-sm font-medium">
                <button type="button" id="tabLoginBtn" onclick="toggleAuthTab('login')" class="flex-1 py-2 rounded-lg bg-white dark:bg-slate-800 text-indigo-900 dark:text-
